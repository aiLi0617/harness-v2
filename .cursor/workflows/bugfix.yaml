# 本文件为工作流参考定义，由对应的 SKILL 或人工按步骤编排执行。
# Cursor IDE 不自动解析此 YAML。
name: bugfix
description: Bug 修复工作流（最小集）
debug: true
global_skills:
  - skills/harness-debug-logger

steps:
  - name: reproduce
    description: 复现 Bug
    skill: skills/systematic-debug
    actions:
      - 收集 bug 信息（日志/堆栈/复现步骤）
      - 在本地环境复现 bug
      - 记录复现结果

  - name: root-cause-analysis
    description: 根因分析
    agent: agents/bug-analyst
    skill: skills/systematic-debug
    actions:
      - 形成假设列表
      - 逐个验证假设
      - 确认根因
      - 输出根因分析到 docs/artifacts/root-cause.md

  - name: fix
    description: 编写修复
    skill: skills/tdd-bugfix
    agent: agents/implementer
    actions:
      - 先写失败测试复现 bug
      - 修改代码让测试通过
      - 运行全量回归测试

  - name: review
    description: 代码审查
    agent: agents/code-reviewer
    review_loop:
      max_rounds: 5
      on_failure: 回退给 implementer 修复
      on_exhausted: 标记人工介入，暂停流程

  - name: verify
    description: 最终验证
    skill: skills/done-verify
    actions:
      - 编译通过
      - 测试全绿
      - Lint 干净
      - diff 只包含修复相关改动

  - name: archive
    description: 制品归档
    actions:
      - 归档 docs/artifacts/ 到 archive/{date}-{task}/

agents:
  - agents/implementer
  - agents/code-reviewer
  - agents/memory-consolidator
  - agents/bug-analyst

# rules/ 已扁平化（无 memory/orchestration/feedback/execution 子目录），按文件名引用即可
rules:
  always:  # 全局 always 规则，所有工作流共享
    - rules-loader
    - stage-contracts
    - correction-detection
    - human-checkpoint
    - java-edit-self-check
  active:
    - exceptions
    - null-safety
    - logging
    - git-branch
    - git-commit
    - compile-guard
    - lint-guard
    - test-guard
    - execution-boundary
    - environment-boundary
