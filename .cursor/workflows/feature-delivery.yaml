name: feature-delivery
description: 完整功能交付工作流索引
version: 2
debug: true
entry_mode: flexible
artifact_root: docs/artifacts/work/{task-id}
orchestration_skill: skills/feature-delivery-workflow

phases:
  - id: requirements
    description: 拆解 PRD 并形成可交付特性清单
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-1-prd-split.yaml
    entry_artifacts: {required: [], optional: [context/prd-source.md]}
    exit_artifacts: [analysis/feature-list.md]
    condition: null
    next: {on_pass: brainstorm, on_fail: human-checkpoint}

  - id: brainstorm
    description: 澄清方案分歧并记录关键决策
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-2-brainstorm.yaml
    entry_artifacts: {required: [analysis/feature-list.md], optional: []}
    exit_artifacts: [design/brainstorm-result.md]
    condition: null
    next: {on_pass: hld, on_fail: human-checkpoint}

  - id: hld
    description: 形成概要设计并完成 HLD 门禁
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-3-hld.yaml
    entry_artifacts: {required: [analysis/feature-list.md], optional: [design/brainstorm-result.md]}
    exit_artifacts: [design/hld.md, quality/gates/hld-design/consistency.md, quality/gates/hld-design/quality-gate.md]
    condition: null
    next: {on_pass: db-api, on_fail: human-checkpoint}

  - id: db-api
    description: 按 HLD 并行完成数据库与 API 设计
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-4-db-api.yaml
    entry_artifacts: {required: [design/hld.md], optional: []}
    exit_artifacts: [design/ddl.md, design/api-contract.md]
    condition: 至少一个数据库或 API 设计分支适用
    next: {on_pass: lld, on_fail: human-checkpoint}

  - id: lld
    description: 形成详细设计并完成 LLD 门禁
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-5-lld.yaml
    entry_artifacts: {required: [design/hld.md], optional: [design/ddl.md, design/api-contract.md]}
    exit_artifacts: [design/lld.md, quality/gates/lld-design/consistency.md, quality/gates/lld-design/quality-gate.md]
    condition: null
    next: {on_pass: implementation-plan, on_fail: human-checkpoint}

  - id: implementation-plan
    description: 将详细设计拆分为可执行实现计划
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-6-plan.yaml
    entry_artifacts: {required: [design/lld.md], optional: []}
    exit_artifacts: [plans/implementation-plan.md]
    condition: null
    next: {on_pass: implementation, on_fail: human-checkpoint}

  - id: implementation
    description: 实施变更并完成实现质量门禁
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-7-code.yaml
    entry_artifacts: {required: [plans/implementation-plan.md], optional: [workflow/decision-log.md]}
    exit_artifacts: [delivery/change-manifest.md, quality/gates/implementation/quality-gate.md]
    condition: null
    next: {on_pass: verify-archive, on_fail: human-checkpoint}

  - id: verify-archive
    description: 完成最终机械验证并归档任务目录
    agent: null
    skills: {required: [], on_demand: []}
    file: workflows/feature-delivery/phase-8-verify-archive.yaml
    entry_artifacts: {required: [delivery/change-manifest.md, quality/gates/implementation/quality-gate.md], optional: []}
    exit_artifacts: [quality/verification-report.md, archive/{date}-{task-id}/]
    condition: 实现质量门禁最后结论为 PASS
    next: {on_pass: end, on_fail: human-checkpoint}

rules:
  always: [rules-loader, stage-contracts, correction-detection, human-checkpoint, java-edit-self-check]
  active: [project-architecture, database, api-design, testing, dependencies, collections, concurrency, datetime, pojo, tenant-isolation, git-branch, git-commit, change-implementation, task-decomposition, compile-guard, lint-guard, test-guard, scope-guard, schema-guard, execution-boundary, environment-boundary]
