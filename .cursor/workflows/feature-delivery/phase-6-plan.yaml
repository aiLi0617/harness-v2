id: implementation-plan
description: 将 LLD 拆成可执行实现计划
execution: {mode: sequential, join: all}
steps:
  - id: implementation-planning
    description: 产出文件级任务、依赖和验证方式
    agent: agents/implementation-planner
    skills: {required: [skills/writing-plans], on_demand: []}
    entry_artifacts: {required: [design/lld.md], optional: [design/hld.md, design/ddl.md, design/api-contract.md, workflow/decision-log.md]}
    exit_artifacts: [plans/implementation-plan.md]
    condition: null
    next: {on_pass: end, on_fail: human-checkpoint}
