id: lld
description: 产出 LLD 并通过设计一致性门禁
execution: {mode: sequential, join: all}
steps:
  - id: detail-design
    description: 产出类和方法级详细设计
    agent: agents/detail-designer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [design/hld.md], optional: [design/ddl.md, design/api-contract.md, workflow/decision-log.md]}
    exit_artifacts: [design/lld.md]
    condition: null
    next: {on_pass: lld-consistency, on_fail: human-checkpoint}
  - id: lld-consistency
    description: 审查 HLD、DDL、API 与 LLD 一致性
    agent: agents/consistency-reviewer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [design/hld.md, design/lld.md], optional: [design/ddl.md, design/api-contract.md]}
    exit_artifacts: [quality/gates/lld-design/consistency.md]
    condition: null
    next: {on_pass: lld-quality-gate, on_fail: lld-quality-gate}
  - id: lld-quality-gate
    description: 裁决 LLD 设计门禁
    agent: agents/quality-gate-reviewer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [quality/gates/lld-design/consistency.md], optional: []}
    exit_artifacts: [quality/gates/lld-design/quality-gate.md]
    condition: null
    review_loop: {max_attempts: 5, fix_target: detail-design, on_exhausted: human-checkpoint}
    next: {on_pass: publish-lld, on_fail: detail-design, on_human_required: human-checkpoint}
  - id: publish-lld
    description: 按需发布 LLD
    agent: null
    skills: {required: [], on_demand: [skills/lld-to-feishu]}
    entry_artifacts: {required: [design/lld.md, quality/gates/lld-design/quality-gate.md], optional: []}
    exit_artifacts: [delivery/publication-links.md]
    condition: 用户要求发布飞书
    next: {on_pass: end, on_skip: end, on_fail: human-checkpoint}
