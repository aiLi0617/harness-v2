# feature-delivery 工作流 · 阶段 5：详细设计 → LLD 一致性审查 → 发布飞书
# 由 feature-delivery-workflow SKILL 按 feature-delivery.yaml 的 phases 顺序编排执行。
# Cursor IDE 不自动解析此 YAML。rules / agents / global_skills 继承 feature-delivery.yaml。
name: feature-delivery/phase-5-lld
description: 产出详细设计、通过一致性审查并发布飞书等待人工确认
phase: 5
entry_artifacts:
  - docs/artifacts/hld.md
  - docs/artifacts/ddl.md
  - docs/artifacts/api-contract.md
exit_artifacts:
  - docs/artifacts/lld.md
  - docs/artifacts/feishu-doc-links.md
prev_phase: feature-delivery/phase-4-db-api
next_phase: feature-delivery/phase-6-plan

steps:
  - name: lld
    description: 详细设计
    agent: agents/lld-author
    actions:
      - 读取 hld.md + ddl.md + api-contract.md
      - 输出类设计、方法签名、业务流程到 docs/artifacts/lld.md

  - name: consistency-review-2
    description: LLD 一致性审查
    agent: agents/consistency-reviewer
    review_loop:
      max_rounds: 5
      on_failure: 回退给 lld-author 修正
      on_exhausted: 标记人工介入，暂停流程
    actions:
      - 读取 hld.md + ddl.md + api-contract.md + lld.md
      - 校验 LLD 类/方法是否覆盖 HLD 所有接口
      - 校验 DDL 字段与 LLD 实体一致
      - 校验 API 契约参数与 LLD 方法签名匹配

  - name: lld-publish
    description: LLD 发布飞书 & 人工确认
    skill: skills/lld-to-feishu
    actions:
      - 将 docs/artifacts/lld.md 发布到飞书云文档，链接记录到 feishu-doc-links.md
      - 等待人工审阅确认（阻塞）
      - 确认通过后进入下一阶段；需修改则回退给 lld-author 后重新发布
