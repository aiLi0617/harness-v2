# feature-delivery 工作流 · 阶段 3：概要设计 → HLD 一致性审查 → 发布飞书
# 由 feature-delivery-workflow SKILL 按 feature-delivery.yaml 的 phases 顺序编排执行。
# Cursor IDE 不自动解析此 YAML。rules / agents / global_skills 继承 feature-delivery.yaml。
name: feature-delivery/phase-3-hld
description: 产出概要设计、通过一致性审查并发布飞书等待人工确认
phase: 3
entry_artifacts:
  - docs/artifacts/feature-list.md
  - docs/artifacts/brainstorm-result.md
exit_artifacts:
  - docs/artifacts/hld.md
  - docs/artifacts/feishu-doc-links.md
prev_phase: feature-delivery/phase-2-brainstorm
next_phase: feature-delivery/phase-4-db-api

steps:
  - name: hld
    description: 概要设计
    agent: agents/architect-hld
    actions:
      - 读取 feature-list.md + brainstorm-result.md
      - 输出模块划分、接口概览、数据流到 docs/artifacts/hld.md

  - name: consistency-review-1
    description: HLD 一致性审查
    agent: agents/consistency-reviewer
    review_loop:
      max_rounds: 5
      on_failure: 回退给 architect-hld 修正
      on_exhausted: 标记人工介入，暂停流程
    actions:
      - 读取 feature-list.md + hld.md
      - 校验每个功能点是否都有对应模块
      - 校验 HLD 是否引入了功能清单没有的内容

  - name: hld-publish
    description: HLD 发布飞书 & 人工确认
    skill: skills/hld-to-feishu
    actions:
      - 将 docs/artifacts/hld.md 发布到飞书云文档，链接记录到 feishu-doc-links.md
      - 等待人工审阅确认（阻塞）
      - 确认通过后进入下一阶段；需修改则回退给 architect-hld 后重新发布
