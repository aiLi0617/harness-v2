id: hld
description: 产出 HLD 并通过设计一致性门禁
execution: {mode: sequential, join: all}
steps:
  - id: hld-authoring
    description: 产出模块级概要设计
    agent: agents/solution-architect
    skills: {required: [], on_demand: [skills/brainstorming]}
    entry_artifacts: {required: [analysis/feature-list.md], optional: [design/brainstorm-result.md, workflow/decision-log.md]}
    exit_artifacts: [design/hld.md]
    condition: null
    next: {on_pass: hld-consistency, on_fail: human-checkpoint}
  - id: hld-consistency
    description: 审查功能清单与 HLD 一致性
    agent: agents/consistency-reviewer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [analysis/feature-list.md, design/hld.md], optional: []}
    exit_artifacts: [quality/gates/hld-design/consistency.md]
    condition: null
    next: {on_pass: hld-quality-gate, on_fail: hld-quality-gate}
  - id: hld-quality-gate
    description: 裁决 HLD 设计门禁
    agent: agents/quality-gate-reviewer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [quality/gates/hld-design/consistency.md], optional: []}
    exit_artifacts: [quality/gates/hld-design/quality-gate.md]
    condition: null
    review_loop: {max_attempts: 5, fix_target: hld-authoring, on_exhausted: human-checkpoint}
    next: {on_pass: publish-hld, on_fail: hld-authoring, on_human_required: human-checkpoint}
  - id: publish-hld
    description: 按需发布 HLD
    agent: null
    skills: {required: [], on_demand: [skills/hld-to-feishu]}
    entry_artifacts: {required: [design/hld.md, quality/gates/hld-design/quality-gate.md], optional: []}
    exit_artifacts: [delivery/publication-links.md]
    condition: 用户要求发布飞书
    next: {on_pass: end, on_skip: end, on_fail: human-checkpoint}
