id: brainstorm
description: 围绕功能清单发散并收敛方案
execution: {mode: sequential, join: all}
steps:
  - id: brainstorm-solution
    description: 比较可行方案、权衡和待决策项
    agent: null
    skills: {required: [skills/brainstorming], on_demand: []}
    entry_artifacts: {required: [analysis/feature-list.md], optional: [workflow/decision-log.md]}
    exit_artifacts: [design/brainstorm-result.md]
    condition: null
    next: {on_pass: end, on_fail: human-checkpoint}
