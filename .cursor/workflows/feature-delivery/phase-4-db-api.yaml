id: db-api
description: 并行产出数据库和 API 契约设计
execution: {mode: parallel, join: all}
steps:
  - id: database-design
    description: 设计数据库结构与迁移策略
    agent: agents/database-designer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [design/hld.md], optional: []}
    exit_artifacts: [design/ddl.md]
    condition: HLD 包含持久化或数据迁移变更
    next: {on_pass: end, on_skip: end, on_fail: human-checkpoint}
  - id: api-design
    description: 设计 API、RPC 或消息契约
    agent: agents/api-designer
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [design/hld.md], optional: []}
    exit_artifacts: [design/api-contract.md]
    condition: HLD 包含 API、RPC 或消息契约变更
    next: {on_pass: end, on_skip: end, on_fail: human-checkpoint}
