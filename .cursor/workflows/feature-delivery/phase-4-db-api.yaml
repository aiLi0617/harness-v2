# feature-delivery 工作流 · 阶段 4：数据库设计 → API 契约设计
# 由 feature-delivery-workflow SKILL 按 feature-delivery.yaml 的 phases 顺序编排执行。
# Cursor IDE 不自动解析此 YAML。rules / agents / global_skills 继承 feature-delivery.yaml。
name: feature-delivery/phase-4-db-api
description: 基于 HLD 产出数据库设计与 API 契约（两步可并行）
phase: 4
parallel: true  # ddl 与 api 均只依赖 hld.md，无相互依赖，可并行执行
entry_artifacts:
  - docs/artifacts/hld.md
exit_artifacts:
  - docs/artifacts/ddl.md
  - docs/artifacts/api-contract.md
prev_phase: feature-delivery/phase-3-hld
next_phase: feature-delivery/phase-5-lld

steps:
  - name: ddl
    description: 数据库设计
    agent: agents/db-ddl
    actions:
      - 读取 hld.md
      - 输出表结构、索引、约束到 docs/artifacts/ddl.md

  - name: api
    description: API 契约设计
    agent: agents/api-contract
    actions:
      - 读取 hld.md
      - 输出接口路径、请求/响应体、状态码到 docs/artifacts/api-contract.md
