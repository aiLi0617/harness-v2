# feature-delivery 工作流 · 阶段 1：PRD 功能拆分
# 由 feature-delivery-workflow SKILL 按 feature-delivery.yaml 的 phases 顺序编排执行。
# Cursor IDE 不自动解析此 YAML。rules / agents / global_skills 继承 feature-delivery.yaml。
name: feature-delivery/phase-1-prd-split
description: 把 PRD（或用户口头需求）拆分为功能点清单
phase: 1
entry_artifacts:
  - docs/artifacts/prd-source.md  # 可选；不存在时接收用户口头需求
exit_artifacts:
  - docs/artifacts/feature-list.md
next_phase: feature-delivery/phase-2-brainstorm

steps:
  - name: prd-import
    description: PRD 导入（可选）
    optional: true
    actions:
      - 用户指定云文档（飞书文档、Confluence 等）URL 或本地文件路径
      - 将云文档内容复制到本地 docs/artifacts/prd-source.md
      - 如用户直接提供口头需求或已有本地文件，跳过此步骤

  - name: prd-split
    description: PRD 功能拆分
    agent: agents/prd-splitter
    actions:
      - 读取 docs/artifacts/prd-source.md（如存在）或接收用户口头需求
      - 拆分为功能点清单，标注优先级和验收标准
      - 输出到 docs/artifacts/feature-list.md
