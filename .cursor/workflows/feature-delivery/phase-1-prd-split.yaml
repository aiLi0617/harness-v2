id: requirements
description: 导入或整理需求并产出功能清单
execution: {mode: sequential, join: all}
steps:
  - id: initialize
    description: 初始化任务目录、状态与日志
    agent: null
    skills: {required: [skills/feature-delivery-workflow, skills/harness-debug-logger], on_demand: []}
    entry_artifacts: {required: [], optional: [context/prd-source.md]}
    exit_artifacts: [workflow/workflow-state.md, workflow/decision-log.md, workflow/harness-debug.md]
    condition: null
    next: {on_pass: requirements-analysis, on_fail: human-checkpoint}
  - id: requirements-analysis
    description: 将 PRD 或用户需求拆成可验收功能清单
    agent: agents/requirements-analyst
    skills: {required: [], on_demand: []}
    entry_artifacts: {required: [], optional: [context/prd-source.md, workflow/decision-log.md]}
    exit_artifacts: [analysis/feature-list.md]
    condition: 存在 PRD 或用户需求
    next: {on_pass: end, on_fail: human-checkpoint}
