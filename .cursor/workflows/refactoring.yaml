# 本文件为工作流参考定义，由对应的 SKILL 或人工按步骤编排执行。
# Cursor IDE 不自动解析此 YAML。
name: refactoring
description: 代码重构工作流（继承 Bug 修复 + 重构专属能力）
debug: true
global_skills:
  - skills/harness-debug-logger

steps:
  - name: code-analysis
    description: 代码分析
    skill: skills/refactor-plan
    actions:
      - 阅读目标代码，识别坏味道（过长方法/重复代码/上帝类/特性依恋等）
      - 评估代码现状的可测试性和可维护性
      - 收集相关测试覆盖情况

  - name: plan
    description: 制定重构方案
    agent: agents/refactoring-planner
    skill: skills/refactor-plan
    actions:
      - 针对每个坏味道选择重构手法
      - 拆分为可独立验证的小步骤序列
      - 输出重构计划到 docs/artifacts/refactoring-plan.md

  - name: refactor
    description: 逐步重构
    agent: agents/implementer
    skill: skills/safe-refactoring
    on_demand_skill: skills/codegen-guard  # 提取类/提取接口等新建文件场景由 implementer 按需调用
    actions:
      - 按重构计划逐步执行
      - 每步只做一种重构操作
      - 涉及新建文件（提取类/提取接口）时,先调用 codegen-guard 守卫
      - 每步完成后立即运行测试
      - 测试红了立即回滚到上一步
      - 禁止在重构中夹带功能变更

  - name: regression
    description: 回归验证
    actions:
      - 运行全量回归测试
      - 确认行为未改变
      - 对比重构前后的接口签名

  - name: quality-review
    description: 质量审查
    agent: agents/code-quality-reviewer
    review_loop:
      max_rounds: 5
      on_failure: 回退给 implementer 修复
      on_exhausted: 标记人工介入，暂停流程

  - name: code-review
    description: 通用代码审查
    agent: agents/code-reviewer
    review_loop:
      max_rounds: 5
      on_failure: 回退给 implementer 修复
      on_exhausted: 标记人工介入，暂停流程

  - name: verify
    description: 最终验证
    skill: skills/done-verify
    actions:
      - 编译通过
      - 测试全绿
      - Lint 干净
      - diff 只包含重构相关改动，无功能变更

  - name: archive
    description: 制品归档
    actions:
      - 归档 docs/artifacts/ 到 archive/{date}-{task}/

# 继承 bugfix 全部规则 + 重构专属新增；rules/ 已扁平化
rules:
  always:  # 全局 always 规则，所有工作流共享
    - rules-loader
    - stage-contracts
    - correction-detection
    - human-checkpoint
    - java-edit-self-check
  active:
    - exceptions
    - null-safety
    - logging
    - method-design
    - naming
    - comments
    - git-branch
    - git-commit
    - change-implementation
    - compile-guard
    - lint-guard
    - test-guard
    - scope-guard
    - execution-boundary
    - environment-boundary

agents:
  # 继承 bugfix
  - agents/implementer
  - agents/code-reviewer
  - agents/memory-consolidator
  # 重构专属
  - agents/refactoring-planner
  - agents/code-quality-reviewer
